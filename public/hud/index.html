<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Neon" />
  <title>NEON · HUD</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/public/hud/style.css" />
  <link rel="icon" type="image/png" sizes="192x192" href="/public/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/public/icons/icon-180.png" />
</head>
<body>
  <div class="scanline"></div>

  <header class="topbar">
    <div class="logo">
      <span class="logo-ring"></span>
      <h1>NEON<span class="blink">_</span></h1>
    </div>
    <div class="status-line">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">CONECTANDO...</span>
    </div>
    <button id="modoBtn" class="modo-btn" data-mode="jarvis" title="Alternar entre Jarvis e Ultron">MODO: JARVIS</button>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main class="layout">
    <!-- ESQUERDA: CONTEÚDO -->
    <section class="panel chat-panel">
      <div class="panel-title">INTERFACE NEURAL <span class="accent">v3.0</span></div>

      <!-- CHAT -->
      <div id="viewChat" class="view active">
        <div id="chat" class="chat"></div>
        <div class="quickbar" id="quickbar">
          <span class="qb-label">RÁPIDO:</span>
          <button class="qb-chip" data-quick="💤 Dormir">💤</button>
          <button class="qb-chip" data-quick="🔒 Bloquear">🔒</button>
          <button class="qb-chip" data-quick="🔌 Desligar">🔌</button>
          <button class="qb-chip" data-quick="🔧 Abrir VSCode">🧰</button>
        </div>
        <form id="chatForm" class="chat-form" autocomplete="off">
          <input id="chatInput" type="text" placeholder="Fale com a Neon..." maxlength="1000" />
          <button type="submit" id="sendBtn" title="Enviar">▲</button>
        </form>
      </div>

      <!-- TERMINAL -->
      <div id="viewTerminal" class="view">
        <div id="termOut" class="term"></div>
        <form id="termForm" class="chat-form" autocomplete="off">
          <span class="term-prompt">&gt;</span>
          <input id="termInput" type="text" placeholder="powershell - ex: Get-Process | Select-Object -First 5" spellcheck="false" />
          <button type="submit" title="Executar">▶</button>
        </form>
      </div>

      <!-- ARQUIVOS -->
      <div id="viewArquivos" class="view">
        <div class="filebar">
          <span id="filePath" class="file-path">C:\</span>
          <button id="btnSubir" class="btn small" title="Pasta anterior">↑</button>
          <button id="btnAtualizar" class="btn small" title="Atualizar">⟳</button>
        </div>
        <div id="fileList" class="file-list"></div>
        <div id="fileEditor" class="file-editor hidden">
          <div class="file-editor-head">
            <span id="fileEditPath" class="file-path"></span>
            <div>
              <button id="btnEditarSalvar" class="btn small">SALVAR</button>
              <button id="btnEditarFechar" class="btn small">✕</button>
            </div>
          </div>
          <textarea id="fileEditText" spellcheck="false"></textarea>
        </div>
      </div>

      <!-- HISTÓRICO -->
      <div id="viewHistorico" class="view">
        <div class="filebar">
          <span class="file-path">HISTÓRICO DE CONVERSA</span>
          <button id="btnHistLimpar" class="btn small" title="Limpar histórico">🗑</button>
          <button id="btnHistAtualizar" class="btn small" title="Atualizar">⟳</button>
        </div>
        <div id="histList" class="file-list"></div>
      </div>

      <!-- TELA AO VIVO -->
      <div id="viewTela" class="view">
        <div class="filebar">
          <span class="file-path">TELA DO PC AO VIVO</span>
          <button id="btnTelaPlay" class="btn small">▶</button>
          <button id="btnTelaStop" class="btn small">■</button>
        </div>
        <div class="screen-wrap">
          <img id="screenImg" alt="Tela do PC" />
          <div class="screen-empty" id="screenEmpty">Toque em ▶ para ver a tela</div>
        </div>
      </div>

      <!-- CELULAR -->
      <div id="viewCelular" class="view">
        <div class="panel-title">CELULAR <span class="accent">ADB</span></div>
        <div class="cel-status" id="celStatus">—</div>
        <div class="control-row" style="flex-wrap:wrap">
          <button id="btnCelConectar" class="btn">📱 Conectar</button>
          <button id="btnCelDesconectar" class="btn">⏹ Desconectar</button>
          <button id="btnCelEspelhar" class="btn">🖥 Espelhar</button>
          <button id="btnCelPrint" class="btn accent">📸 Print</button>
        </div>
        <div class="filebar" style="margin-top:10px">
          <input id="celApp" class="term-input" placeholder="whatsapp, youtube, instagram..." />
          <button id="btnCelAbrir" class="btn small">ABRIR APP</button>
        </div>
        <div id="celShot" class="screen-wrap hidden">
          <img id="celShotImg" alt="Print do celular" />
        </div>
      </div>

      <!-- OPENCODE -->
      <div id="viewOpencode" class="view">
        <div class="panel-title">OPCODE <span class="accent">NEONWORLD</span></div>
        <div id="ocChat" class="chat"></div>
        <form id="ocForm" class="chat-form" autocomplete="off">
          <input id="ocInput" type="text" placeholder="Diga ao opencode o que mexer no NEONWORLD..." maxlength="3000" />
          <button type="submit" title="Executar">▲</button>
        </form>
      </div>

      <!-- PROJETOS 3D -->
      <div id="viewProjetos3d" class="view">
        <iframe id="frameProjetos" data-src="/public/hud/projetos3d.html" style="width:100%;height:100%;min-height:420px;border:0;border-radius:12px;background:#05050c"></iframe>
      </div>
      <div id="viewHolomap" class="view">
        <iframe id="frameHolomap" data-src="/public/hud/holomap.html" style="width:100%;height:100%;min-height:420px;border:0;border-radius:12px;background:#030811"></iframe>
      </div>
    </section>

    <!-- STATUS -->
    <section class="panel core-panel">
      <div class="core">
        <div class="core-rings" aria-hidden="true"></div>
        <div class="core-center">
          <span class="core-label">NEON AI</span>
          <span id="coreStatus" class="core-status">ONLINE</span>
          <span id="coreCpu" class="core-cpu">CPU --%</span>
        </div>
      </div>

      <div class="meters">
        <div class="meter" data-ring="ram">
          <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="ringRam" cx="50" cy="50" r="44"/></svg>
          <div class="meter-label"><span>RAM</span><strong id="ramVal">--%</strong></div>
        </div>
        <div class="meter" data-ring="disk">
          <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="ringDisk" cx="50" cy="50" r="44"/></svg>
          <div class="meter-label"><span>DISCO</span><strong id="diskVal">--%</strong></div>
        </div>
        <div class="meter" data-ring="bat">
          <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="ringBat" cx="50" cy="50" r="44"/></svg>
          <div class="meter-label"><span>BATERIA</span><strong id="batVal">--%</strong></div>
        </div>
      </div>

      <div class="pc-line" id="pcLine">--</div>

      <div class="controls">
        <div class="control-row">
          <label>VOLUME</label>
          <input id="volRange" type="range" min="0" max="100" value="50" />
          <strong id="volVal">50%</strong>
        </div>
        <div class="control-row">
          <button id="btnShot" class="btn">SCREENSHOT</button>
          <button id="btnNotify" class="btn accent">NOTIFICAR</button>
        </div>
        <button id="micBtn" class="mic" title="Falar com a Neon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/>
          </svg>
          <span id="micLabel">PUSH TO TALK</span>
        </button>
        <button id="btnVozAssistente" class="btn" title="Ativar assistente por voz">🎙️ VOZ: DESLIGADA</button>
      </div>
    </section>
  </main>

  <!-- NAV MOBILE -->
  <nav class="bottomnav" id="bottomnav">
    <button class="bn-item active" data-view="chat"><span>💬</span><span>Chat</span></button>
    <button class="bn-item" data-view="terminal"><span>⌨</span><span>Terminal</span></button>
    <button class="bn-item" data-view="arquivos"><span>📁</span><span>Arquivos</span></button>
    <button class="bn-item" data-view="historico"><span>🕓</span><span>Histórico</span></button>
    <button class="bn-item" data-view="tela"><span>🖥</span><span>Tela</span></button>
    <button class="bn-item" data-view="celular"><span>📱</span><span>Celular</span></button>
    <button class="bn-item" data-view="opencode"><span>🤖</span><span>Opcode</span></button>
    <button class="bn-item" data-view="projetos3d"><span>🧊</span><span>3D</span></button>
    <button class="bn-item" data-view="holomap"><span>🌐</span><span>Holomap</span></button>
  </nav>

  <div id="shotModal" class="modal hidden">
    <div class="modal-box">
      <button id="closeShot" class="modal-close">✕</button>
      <img id="shotImg" alt="Screenshot" />
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/public/hud/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
