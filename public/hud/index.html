<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON · HUD</title>
  <link rel="stylesheet" href="/public/hud/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%2300f0ff' stroke-width='6'/></svg>" />
</head>
<body>
  <div class="scanline"></div>

  <header class="topbar">
    <div class="logo">
      <span class="logo-ring"></span>
      <h1>NEON<span class="blink">_</span></h1>
    </div>
    <div class="status-line">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">CONECTANDO...</span>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main class="layout">
    <!-- CHAT -->
    <section class="panel chat-panel">
      <div class="panel-title">INTERFACE NEURAL <span class="accent">v2.0</span></div>
      <div id="chat" class="chat"></div>
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" type="text" placeholder="Fale com a Neon..." maxlength="1000" />
        <button type="submit" id="sendBtn" title="Enviar">▲</button>
      </form>
    </section>

    <!-- STATUS -->
    <section class="panel core-panel">
      <div class="core">
        <div class="core-rings" aria-hidden="true"></div>
        <div class="core-center">
          <span class="core-label">NEON AI</span>
          <span id="coreStatus" class="core-status">ONLINE</span>
          <span id="coreCpu" class="core-cpu">CPU --%</span>
        </div>
      </div>

      <div class="meters">
        <div class="meter" data-ring="ram">
          <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="ringRam" cx="50" cy="50" r="44"/></svg>
          <div class="meter-label"><span>RAM</span><strong id="ramVal">--%</strong></div>
        </div>
        <div class="meter" data-ring="disk">
          <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="ringDisk" cx="50" cy="50" r="44"/></svg>
          <div class="meter-label"><span>DISCO</span><strong id="diskVal">--%</strong></div>
        </div>
        <div class="meter" data-ring="bat">
          <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="ringBat" cx="50" cy="50" r="44"/></svg>
          <div class="meter-label"><span>BATERIA</span><strong id="batVal">--%</strong></div>
        </div>
      </div>

      <div class="pc-line" id="pcLine">--</div>

      <div class="controls">
        <div class="control-row">
          <label>VOLUME</label>
          <input id="volRange" type="range" min="0" max="100" value="50" />
          <strong id="volVal">50%</strong>
        </div>
        <div class="control-row">
          <button id="btnShot" class="btn">SCREENSHOT</button>
          <button id="btnNotify" class="btn accent">NOTIFICAR</button>
        </div>
        <button id="micBtn" class="mic" title="Falar com a Neon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/>
          </svg>
          <span id="micLabel">PUSH TO TALK</span>
        </button>
      </div>
    </section>
  </main>

  <div id="shotModal" class="modal hidden">
    <div class="modal-box">
      <button id="closeShot" class="modal-close">✕</button>
      <img id="shotImg" alt="Screenshot" />
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/public/hud/app.js"></script>
</body>
</html>
