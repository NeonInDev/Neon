<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEON · HOLOMAP</title>
  <style>
    :root { color-scheme: dark; --c:#00f0ff; --bg:#030811; }
    * { box-sizing:border-box } html,body { margin:0; width:100%; height:100%; overflow:hidden; background:radial-gradient(circle at center,#10233a,var(--bg) 72%); color:#b8e6ea; font:14px "Segoe UI",sans-serif }
    #map { width:100%; height:100%; display:block; touch-action:none }
    .hud { position:fixed; z-index:2; inset:16px 20px auto; pointer-events:none; text-shadow:0 0 12px #00f0ff }
    .hud strong { color:var(--c); letter-spacing:4px } .hud small { display:block; margin-top:8px; color:#76aeb8; letter-spacing:1px }
    .tools { position:fixed; z-index:3; right:18px; top:18px; display:flex; gap:8px }
    button { border:1px solid #00f0ff88; color:#b8e6ea; background:#071522dd; padding:8px 12px; border-radius:7px; cursor:pointer }
    button:hover { box-shadow:0 0 14px #00f0ff66; color:#fff }
    #cam { position:fixed; z-index:2; right:18px; bottom:18px; width:180px; border:1px solid #00f0ff88; border-radius:10px; opacity:.72; transform:scaleX(-1); display:none }
    #status { position:fixed; left:20px; bottom:18px; color:#76aeb8 }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="hud"><strong>HOLOMAP · NEONWORLD</strong><small>arraste para orbitar · roda para zoom · toque nos nós</small></div>
  <div class="tools"><button id="camBtn">WEBCAM</button><button id="resetBtn">RESET</button></div>
  <video id="cam" autoplay muted playsinline></video>
  <div id="status">inicializando mapa...</div>
  <script>
    const canvas=document.getElementById("map"), ctx=canvas.getContext("2d"), status=document.getElementById("status");
    const cam=document.getElementById("cam"), camBtn=document.getElementById("camBtn");
    const nodes=[
      {name:"NEON",type:"IA",x:0,y:0,z:0,c:"#00f0ff"},
      {name:"PC LOCAL",type:"Windows",x:-3,y:1,z:1,c:"#ff9d00"},
      {name:"OPENCODE",type:"Agente",x:3,y:1,z:-1,c:"#a78bfa"},
      {name:"YGGDRASIL",type:"Tailscale",x:0,y:-2,z:2,c:"#35d07f"},
      {name:"HUD",type:"Interface",x:-2,y:-1,z:-2,c:"#ff4d9d"},
      {name:"PROJETOS",type:"Workspace",x:2,y:-1,z:2,c:"#f1e05a"}
    ];
    let w=0,h=0,rx=-.15,ry=0,zoom=1,drag=null;
    function resize(){w=canvas.width=innerWidth*devicePixelRatio;h=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight}
    function project(n){const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);let x=n.x*cy-n.z*sy,z=n.x*sy+n.z*cy,y=n.y*cx-z*sx,z2=n.y*sx+z*cx;const s=zoom*95/(7-z2);return {x:w/2+x*s,y:h/2-y*s,s:Math.max(8,14*s/95),z:z2}}
    function draw(){ctx.clearRect(0,0,w,h);const pts=nodes.map(n=>({n,p:project(n)})).sort((a,b)=>a.p.z-b.p.z);ctx.strokeStyle="#00f0ff22";ctx.lineWidth=1;pts.forEach(a=>{ctx.beginPath();ctx.moveTo(w/2,h/2);ctx.lineTo(a.p.x,a.p.y);ctx.stroke()});pts.forEach(({n,p})=>{ctx.shadowBlur=18;ctx.shadowColor=n.c;ctx.fillStyle=n.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#d8ffff";ctx.font="12px Segoe UI";ctx.fillText(n.name,p.x+p.s+8,p.y+4);ctx.fillStyle="#6f9ca5";ctx.font="10px Segoe UI";ctx.fillText(n.type,p.x+p.s+8,p.y+17)});requestAnimationFrame(draw)}
    canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,rx,ry};canvas.setPointerCapture(e.pointerId)});
    canvas.addEventListener("pointermove",e=>{if(!drag)return;ry=drag.ry+(e.clientX-drag.x)/220;rx=Math.max(-1.3,Math.min(1.3,drag.rx+(e.clientY-drag.y)/220))});
    canvas.addEventListener("pointerup",()=>drag=null); canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.2,zoom*(e.deltaY<0?1.1:.9)))},{passive:false});
    document.getElementById("resetBtn").onclick=()=>{rx=-.15;ry=0;zoom=1};
    camBtn.onclick=async()=>{if(cam.srcObject){cam.srcObject.getTracks().forEach(t=>t.stop());cam.srcObject=null;cam.style.display="none";camBtn.textContent="WEBCAM";return}try{cam.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});cam.style.display="block";camBtn.textContent="DESLIGAR CAMERA";status.textContent="webcam ativa — gestos serão adicionados na próxima etapa"}catch(e){status.textContent="webcam bloqueada ou indisponível"}};
    addEventListener("resize",resize);resize();draw();status.textContent=`${nodes.length} nós holográficos ativos`;
  </script>
</body>
</html>
