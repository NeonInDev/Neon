<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neon - Conectar WhatsApp</title>
<style>
  body { font-family: system-ui, sans-serif; background: #075E54; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
  .card { background: #fff; color: #333; border-radius: 16px; padding: 30px 40px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #666; margin: 4px 0; }
  #qr { margin: 18px auto; width: 260px; height: 260px; background: #fff; border: 1px solid #ddd; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  #qr img { width: 240px; height: 240px; }
  .status { font-size: 14px; margin-top: 10px; }
  .ok { color: #128C7E; font-weight: 600; }
  .erro { color: #d32f2f; }
  .steps { font-size: 13px; color: #555; margin-top: 12px; line-height: 1.5; text-align: left; }
</style>
</head>
<body>
  <div class="card">
    <h1>Neon 💚 WhatsApp</h1>
    <p>Escaneie o QR com seu celular:</p>
    <div id="qr"><p style="color:#999">Carregando QR...</p></div>
    <div class="status" id="status">Conectando...</div>
    <div class="steps">
      1. Abra o <b>WhatsApp</b> no celular<br>
      2. Menu <b>(⋮)</b> → <b>Aparelhos conectados</b><br>
      3. Toque em <b>Conectar um aparelho</b><br>
      4. Aponte a câmera para o QR ao lado
    </div>
  </div>
<script>
  const CHAVE = "__CHAVE__";
  async function atualizar() {
    const qr = document.getElementById("qr");
    const st = document.getElementById("status");
    try {
      const r = await fetch("/api/whatsapp/status?key=" + encodeURIComponent(CHAVE), { headers: { "X-Hud-Key": CHAVE } });
      const j = await r.json();
      if (j.conectado) {
        st.innerHTML = '<span class="ok">✅ Conectado! Pode fechar esta página.</span>';
        qr.innerHTML = "<p style='color:#128C7E'>Conectado!</p>";
        return;
      }
      if (j.estado === "qr") {
        st.innerHTML = "Aponte a câmera para o QR abaixo";
        const img = document.createElement("img");
        img.src = "/api/whatsapp/qr?key=" + encodeURIComponent(CHAVE) + "&ts=" + Date.now();
        img.onerror = () => {};
        qr.innerHTML = "";
        qr.appendChild(img);
      } else {
        st.innerHTML = "Estado: " + j.estado;
      }
    } catch (e) {
      st.innerHTML = '<span class="erro">Não consegui falar com a Neon.</span>';
    }
  }
  atualizar();
  setInterval(atualizar, 1500);
</script>
</body>
</html>
